<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BoloSystem Web</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><div><h1>🍰 BoloSystem</h1><p>Gestão da confeitaria</p></div><button id="temaBtn" class="secondary" type="button">Alternar tema</button></header>
<nav><button class="tab active" data-tab="produtos">Produtos</button><button class="tab" data-tab="clientes">Clientes</button><button class="tab" data-tab="pedidos">Pedidos</button></nav>
<main><p id="mensagem" role="status" aria-live="polite"></p>
<section id="produtos" class="painel active"><div class="card"><h2 id="produtoTitulo">Cadastrar produto</h2><form id="produtoForm"><input type="hidden" id="produtoId"><label for="produtoNome">Nome</label><input id="produtoNome" maxlength="150" required><label for="produtoPreco">Preço (R$)</label><input id="produtoPreco" type="number" min="0" step="0.01" required><div class="actions"><button type="submit">Salvar</button><button type="button" id="produtoLimpar" class="secondary">Limpar</button></div></form></div><div class="card"><div class="heading"><h2>Produtos cadastrados</h2><button id="produtosAtualizar" class="secondary" type="button">Atualizar</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Nome</th><th>Preço</th><th>Ações</th></tr></thead><tbody id="produtosLista"></tbody></table></div></div></section>
<section id="clientes" class="painel"><div class="card"><h2 id="clienteTitulo">Cadastrar cliente</h2><form id="clienteForm"><input type="hidden" id="clienteId"><label for="clienteNome">Nome *</label><input id="clienteNome" required maxlength="150"><label for="clienteContato">Contato</label><input id="clienteContato"><label for="clienteCpf">CPF</label><input id="clienteCpf"><label for="clienteEndereco">Endereço</label><input id="clienteEndereco"><label for="clienteReferencia">Ponto de referência</label><input id="clienteReferencia"><div class="actions"><button type="submit">Salvar cliente</button><button type="button" id="clienteLimpar" class="secondary">Limpar</button></div></form></div><div class="card"><div class="heading"><h2>Clientes cadastrados</h2><button id="clientesAtualizar" class="secondary" type="button">Atualizar</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Nome</th><th>Contato</th><th>Ações</th></tr></thead><tbody id="clientesLista"></tbody></table></div></div></section>
<section id="pedidos" class="painel"><div class="card"><h2>Novo pedido</h2><form id="pedidoForm"><label for="pedidoCliente">Cliente</label><select id="pedidoCliente" required><option value="">Carregando clientes...</option></select><label for="pedidoProduto">Produto</label><select id="pedidoProduto" required><option value="">Carregando produtos...</option></select><label for="pedidoQuantidade">Quantidade</label><input id="pedidoQuantidade" type="number" min="1" step="1" value="1" required><button type="submit">Registrar pedido</button></form><p class="hint">O total é calculado no servidor com base no preço cadastrado do produto.</p></div></section>
</main><footer>BoloSystem · Aplicação local</footer><script src="/js/app.js"></script></body></html>
